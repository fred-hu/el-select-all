# 1 工作流名称
name: Deploy

# 2 工作流执行名称
run-name: ${{ github.actor }} is update repo, start building...

# 3 触发器
on:
  # 仅 push 到 master 时部署
  push:
    branches: ["master"]
  # 允许您从“操作”选项卡手动运行此工作流
  workflow_dispatch:

# 4 设置权限（部署 gh-pages 需要写权限）
permissions:
  contents: write

# 5 部署不并发执行（排队，避免 gh-pages 被中断的部署覆盖）
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1 检出代码
      - name: Checkout code (检出代码)
        uses: actions/checkout@v5

      # 2 安装 pnpm（需在 setup-node 之前，以便 setup-node 读取 pnpm store 做缓存）
      - name: Install pnpm (安装 pnpm)
        uses: pnpm/action-setup@v5
        with:
          version: 7.33.7

      # 3 安装 node（版本与 pnpm-lock.yaml 的格式保持一致）
      - name: Setup Node.js (设置 node 版本)
        uses: actions/setup-node@v5
        with:
          node-version: 16
          cache: pnpm

      # 4 安装依赖（lockfile 与 package.json 不一致时直接失败）
      - name: Install dependencies (安装依赖)
        run: pnpm install --frozen-lockfile

      # 5 代码检查
      - name: Lint (代码检查)
        run: pnpm run lint

      # 6 单元测试
      - name: Test (单元测试)
        run: pnpm run test

      # 7 构建演示站点
      - name: Build (构建)
        run: pnpm run build:travis

      # 8 部署到 gh-pages 分支（手动触发时也仅允许 master）
      - name: Deploy to GitHub Pages (部署到 gh-pages 分支)
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
