# PR 校验：合并到 master 前的代码检查、单元测试与构建
name: CI

# 工作流执行名称
run-name: ${{ github.actor }} is validating PR...

on:
  # 仅 PR（目标是 master）触发，不部署
  pull_request:
    branches: ["master"]
  # 允许您从“操作”选项卡手动运行此工作流
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 的新提交会自动取消上一次仍在运行的校验
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # 1 检出代码
      - name: Checkout code (检出代码)
        uses: actions/checkout@v4

      # 2 安装 pnpm（需在 setup-node 之前，以便 setup-node 读取 pnpm store 做缓存）
      - name: Install pnpm (安装 pnpm)
        uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      # 3 安装 node（版本与 pnpm-lock.yaml 的格式保持一致）
      - name: Setup Node.js (设置 node 版本)
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: pnpm

      # 4 安装依赖（lockfile 与 package.json 不一致时直接失败）
      - name: Install dependencies (安装依赖)
        run: pnpm install --frozen-lockfile

      # 5 代码检查
      - name: Lint (代码检查)
        run: pnpm run lint

      # 6 单元测试
      - name: Test (单元测试)
        run: pnpm run test

      # 7 构建演示站点，确认可构建
      - name: Build (构建)
        run: pnpm run build:travis
